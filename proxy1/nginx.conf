events {}
http {
    server {
        listen 80;
        location / {
            proxy_pass http://proxy2:80;
            # Ensure X-Forwarded-For is derived from the client IP, not user‑supplied header
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
