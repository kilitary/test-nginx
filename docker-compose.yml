version: "3.8"

services:
    proxy1:
        image: nginx:alpine
        container_name: proxy1
        ports:
            - "8081:80"
        volumes:
            - ./proxy1/nginx.conf:/etc/nginx/nginx.conf:ro
        restart: unless-stopped

    proxy2:
        image: nginx:alpine
        container_name: proxy2
        ports:
            - "8082:80"
        volumes:
            - ./proxy2/nginx.conf:/etc/nginx/nginx.conf:ro
        restart: unless-stopped

    proxy3:
        image: nginx:alpine
        container_name: proxy3
        ports:
            - "8083:80"
        volumes:
            - ./proxy3/nginx.conf:/etc/nginx/nginx.conf:ro
        restart: unless-stopped

    simple-http:
        build: ./simple_http
        container_name: simple-http
        ports:
            - "8084:8080"
        restart: unless-stopped
